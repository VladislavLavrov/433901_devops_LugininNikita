services:
  mariadb:
    image: mariadb:10.11
    container_name: calculator_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root_password_change_me
      MARIADB_DATABASE: calculator_db
      MARIADB_USER: calculator_user
      MARIADB_PASSWORD: calculator_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: calculator_web
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5006
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=calculator_db;User=calculator_user;Password=calculator_password;"
    ports:
      - "5067:5006"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data: